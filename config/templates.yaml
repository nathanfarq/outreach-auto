# Email templates for TaxBuddy cold outreach.
# Each style has a subject and body. Use {placeholders} for variable substitution.
# Mandatory slots: {personalized_opener}, {name}, {firm}
#
# Style guide:
#   general  — warm professional; most contacts with a clear role and good hook
#   direct   — founder-to-founder; contact shows builder/operator signals
#   curious  — light and exploratory; sparse notes or thin hook

styles:
  general:
    subject: "Quick intro — TaxBuddy"
    body: |
      {personalized_opener}

      I'm Nathan, co-founder of TaxBuddy — we help accounting professionals and
      finance teams automate the tedious parts of tax work so they can focus on
      client relationships.

      Would love to connect and hear what you're working on at {firm}. Would a
      20-minute call this week work for you, {name}?

      Best,
      Nathan
      TaxBuddy | nathan@taxbuddy.online

  direct:
    subject: "Fellow builder → TaxBuddy"
    body: |
      {personalized_opener}

      I'm Nathan — building TaxBuddy to remove the manual overhead from tax
      workflows. We're early-stage and moving fast; always good to connect with
      people who are building things.

      Straight to it: I think there's an interesting overlap between what you're
      doing at {firm} and what we're solving. Happy to show you the product in
      15 minutes if you're curious.

      Worth a chat?

      Nathan
      TaxBuddy | nathan@taxbuddy.online

  curious:
    subject: "Came across your work — quick question"
    body: |
      {personalized_opener}

      I'm Nathan, co-founder of TaxBuddy. I wanted to reach out — I'm curious
      how teams like yours at {firm} are currently handling the tax compliance
      side of things.

      No pitch, just genuinely curious. Open to a quick call if you're up for
      it, {name}.

      Nathan
      TaxBuddy | nathan@taxbuddy.online
