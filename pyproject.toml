[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-auto"
version = "0.1.0"
description = "Modular cold outreach automation for TaxBuddy customer discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "notion-client>=2.2.1,<3.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "tavily-python>=0.3.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
